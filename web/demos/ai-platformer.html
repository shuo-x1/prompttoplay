<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>像素勇者 - 横版闯关</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0d0f1a;font-family:"Courier New",monospace;}
  #wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;image-rendering:pixelated;background:#1a1c2c;}
  #touch{position:absolute;inset:0;pointer-events:none;display:none;}
  .tbtn{position:absolute;pointer-events:auto;background:rgba(255,255,255,0.10);border:2px solid rgba(255,255,255,0.35);
    border-radius:12px;color:#f8f8f8;font-family:"Courier New",monospace;font-weight:bold;display:flex;
    align-items:center;justify-content:center;user-select:none;font-size:16px;}
  .tbtn:active{background:rgba(255,255,255,0.28);}
  #bL{left:14px;bottom:100px;width:74px;height:74px;font-size:28px;}
  #bR{left:100px;bottom:100px;width:74px;height:74px;font-size:28px;}
  #bJ{right:14px;bottom:100px;width:82px;height:82px;font-size:20px;}
  #bA{right:104px;bottom:100px;width:82px;height:82px;font-size:20px;}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="touch">
  <div class="tbtn" id="bL">◀</div>
  <div class="tbtn" id="bR">▶</div>
  <div class="tbtn" id="bJ">跳</div>
  <div class="tbtn" id="bA">砍</div>
</div>
<script>
"use strict";
/* ==================== 基础设置 ==================== */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;
const W = 960, H = 540;            // 逻辑分辨率
let scale = 1, offX = 0, offY = 0;

function resize(){
  const ww = window.innerWidth, wh = window.innerHeight;
  scale = Math.min(ww / W, wh / H);
  cv.width = Math.floor(W * scale);
  cv.height = Math.floor(H * scale);
  cv.style.width = cv.width + 'px';
  cv.style.height = cv.height + 'px';
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

/* ==================== 音效引擎 ==================== */
let audioCtx = null;
function ensureAudio(){
  if(!audioCtx){
    try{ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq1, freq2, dur, type, vol, delay){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + (delay || 0);
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type || 'square';
  osc.frequency.setValueAtTime(freq1, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq2), t0 + dur);
  g.gain.setValueAtTime(vol || 0.12, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.02);
}
const SFX = {
  jump(){ tone(320, 640, 0.12, 'square', 0.10); },
  attack(){ tone(760, 200, 0.09, 'square', 0.10); tone(1200, 400, 0.05, 'sawtooth', 0.05); },
  hit(){ tone(220, 90, 0.10, 'triangle', 0.14); },
  hurt(){ tone(300, 80, 0.22, 'sawtooth', 0.14); },
  coin(){ tone(880, 1320, 0.08, 'sine', 0.10); tone(1320, 1760, 0.07, 'sine', 0.07, 0.05); },
  explode(){ tone(140, 30, 0.28, 'sawtooth', 0.16); tone(90, 25, 0.3, 'square', 0.10, 0.02); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f, f, 0.16, 'square', 0.10, i*0.13)); },
  lose(){ [420,320,220,140].forEach((f,i)=>tone(f, f*0.85, 0.2, 'triangle', 0.12, i*0.16)); },
  boss(){ tone(70, 45, 0.6, 'sawtooth', 0.16); },
  power(){ tone(500, 900, 0.1, 'sine', 0.10); tone(700, 1200, 0.12, 'sine', 0.08, 0.08); }
};

/* ==================== Juice 系统 ==================== */
let shakeTime = 0, shakeIntensity = 0;
function screenShake(intensity, duration){ shakeIntensity = Math.max(shakeIntensity, intensity); shakeTime = Math.max(shakeTime, duration); }
let hitStopFrames = 0;
function hitStop(frames){ hitStopFrames = Math.max(hitStopFrames, frames); }

let particles = [];
class Particle{
  constructor(x,y,vx,vy,color,size,life,gravity){
    this.x=x; this.y=y; this.vx=vx; this.vy=vy; this.color=color;
    this.size=size; this.life=life; this.maxLife=life; this.gravity=gravity||0;
  }
  update(){ this.x+=this.vx; this.y+=this.vy; this.vy+=this.gravity; this.vx*=0.985; this.life--; }
  draw(c){
    const a = Math.max(0, this.life/this.maxLife);
    c.globalAlpha = a;
    c.fillStyle = this.color;
    const s = Math.max(1, Math.round(this.size));
    c.fillRect(Math.round(this.x), Math.round(this.y), s, s);
    c.globalAlpha = 1;
  }
}
function burst(x,y,count,colors,spd,size,life,grav){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = spd*(0.35+Math.random());
    particles.push(new Particle(x,y,Math.cos(ang)*sp,Math.sin(ang)*sp - (grav?1:0),
      colors[(Math.random()*colors.length)|0], size*(0.6+Math.random()*0.8), life*(0.6+Math.random()*0.6), grav||0));
  }
}
let floatTexts = [];
class FloatingText{
  constructor(x,y,text,color,size){ this.x=x; this.y=y; this.text=text; this.color=color; this.size=size; this.life=60; this.vy=-1.6; }
  update(){ this.y+=this.vy; this.vy*=0.94; this.life--; }
  draw(c){
    c.globalAlpha = Math.min(1, this.life/26);
    c.font = 'bold '+this.size+'px "Courier New", monospace';
    c.textAlign='center';
    c.fillStyle = '#000';
    c.fillText(this.text, this.x+2, this.y+2);
    c.fillStyle = this.color;
    c.fillText(this.text, this.x, this.y);
    c.globalAlpha = 1;
    c.textAlign='left';
  }
}
function floatText(x,y,txt,color,size){ floatTexts.push(new FloatingText(x,y,txt,color,size||16)); }

const easeOutCubic = t => 1 - Math.pow(1-t,3);
const backEase = t => 1 + 2.7*Math.pow(t-1,3) + 1.7*Math.pow(t-1,2);
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }

/* ==================== 输入 ==================== */
const keys = {};
const input = { left:false, right:false, jump:false, attack:false, jumpPressed:false, attackPressed:false };
window.addEventListener('keydown', e=>{
  ensureAudio();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)) e.preventDefault();
  if(!keys[e.code]){
    if(e.code==='ArrowLeft'||e.code==='KeyA') input.left = true;
    if(e.code==='ArrowRight'||e.code==='KeyD') input.right = true;
    if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space'){ input.jump = true; input.jumpPressed = true; }
    if(e.code==='KeyJ'||e.code==='KeyK'||e.code==='KeyX'){ input.attack = true; input.attackPressed = true; }
    if(e.code==='KeyP'||e.code==='Escape'){ togglePause(); }
    if(e.code==='Enter'||e.code==='Space'){
      if(game.state==='title' || game.state==='over' || game.state==='win') startGame();
    }
  }
  keys[e.code] = true;
});
window.addEventListener('keyup', e=>{
  if(e.code==='ArrowLeft'||e.code==='KeyA') input.left = false;
  if(e.code==='ArrowRight'||e.code==='KeyD') input.right = false;
  if(e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Space') input.jump = false;
  if(e.code==='KeyJ'||e.code==='KeyK'||e.code==='KeyX') input.attack = false;
  keys[e.code] = false;
});

/* 触摸控制 */
const touchEl = document.getElementById('touch');
if('ontouchstart' in window || navigator.maxTouchPoints > 0){
  touchEl.style.display = 'block';
}
function bindTouch(id, on, off){
  const el = document.getElementById(id);
  const start = e=>{ e.preventDefault(); ensureAudio(); on(); };
  const end = e=>{ e.preventDefault(); off(); };
  el.addEventListener('touchstart', start, {passive:false});
  el.addEventListener('touchend', end, {passive:false});
  el.addEventListener('touchcancel', end, {passive:false});
  el.addEventListener('mousedown', start);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', end);
}
bindTouch('bL', ()=>{ input.left=true; }, ()=>{ input.left=false; });
bindTouch('bR', ()=>{ input.right=true; }, ()=>{ input.right=false; });
bindTouch('bJ', ()=>{ input.jump=true; input.jumpPressed=true; }, ()=>{ input.jump=false; });
bindTouch('bA', ()=>{ input.attack=true; input.attackPressed=true; }, ()=>{ input.attack=false; });
cv.addEventListener('touchstart', e=>{
  ensureAudio();
  if(game.state==='title' || game.state==='over' || game.state==='win'){
    startGame();
  }
}, {passive:true});

/* ==================== 游戏状态 ==================== */
const game = {
  state: 'title',          // title | play | pause | over | win
  score: 0, displayScore: 0,
  best: parseInt(localStorage.getItem('pxHeroBest')||'0', 10),
  time: 0,
  levelLen: 6200,          // 关卡总长度
  camX: 0,
  coins: 0,
  combo: 0, comboTimer: 0
};
let player, enemies, platforms, coins, spikes, hazards, boss, level, portal;
let scorePop = 0;

const GRAVITY = 0.62;
const MAXFALL = 15;

function resetGame(){
  game.score = 0; game.displayScore = 0; game.time = 0; game.camX = 0;
  game.coins = 0; game.combo = 0; game.comboTimer = 0;
  particles = []; floatTexts = []; enemies = []; platforms = []; coins = []; spikes = []; hazards = [];
  boss = null; portal = null;

  player = {
    x: 80, y: 380, w: 26, h: 34,
    vx: 0, vy: 0, onGround: false, facing: 1,
    hp: 5, maxHp: 5, invuln: 0, jumpCount: 0,
    attackTimer: 0, attackCD: 0, squashX: 1, squashY: 1,
    animFrame: 0, animTimer: 0, shield: 0, dead: false
  };

  buildLevel();
}

function addPlatform(x,y,w,h,type,opt){
  const p = { x,y,w,h, type: type||'solid', ...opt };
  if(type==='moving'){
    p.ox = x; p.oy = y; p.range = opt.range || 120; p.speed = opt.speed || 0.018; p.phase = opt.phase || 0;
    p.vertical = !!opt.vertical;
  }
  platforms.push(p);
  return p;
}

function buildLevel(){
  // 地面段
  const groundY = 470;
  addPlatform(0, groundY, 760, 70, 'solid');
  addPlatform(900, groundY, 520, 70, 'solid');
  addPlatform(1560, groundY, 420, 70, 'solid');

  // 浮空平台
  addPlatform(300, 370, 110, 18, 'solid');
  addPlatform(500, 300, 120, 18, 'solid');
  addPlatform(700, 380, 100, 18, 'solid');
  addPlatform(1000, 340, 130, 18, 'solid');
  addPlatform(1220, 250, 110, 18, 'solid');
  addPlatform(1420, 360, 120, 18, 'solid');
  addPlatform(1700, 300, 120, 18, 'solid');
  addPlatform(1900, 380, 130, 18, 'solid');

  // 移动平台
  addPlatform(1180, 420, 90, 16, 'moving', {range:110, speed:0.016, phase:0, vertical:false});
  addPlatform(1600, 300, 90, 16, 'moving', {range:90, speed:0.02, phase:1.5, vertical:true});
  addPlatform(2050, 400, 90, 16, 'moving', {range:140, speed:0.015, phase:3, vertical:false});

  // 尖刺
  addSpikes(820, groundY, 80);
  addSpikes(1450, groundY, 60);
  addSpikes(2000, groundY, 70);

  // 平台上的尖刺
  addSpikes(520, 300, 50);

  // 金币
  const coinPos = [
    [330,330],[360,330],[390,330],
    [530,255],[560,255],[590,255],
    [730,335],[760,335],
    [1030,290],[1060,290],[1090,290],
    [1250,200],[1280,200],
    [1450,315],[1480,315],
    [1730,255],[1760,255],
    [1950,335],[1980,335],
    [1200,370],[1230,370],
    [1640,255],[1670,255],
    [2100,350],[2130,350],[2160,350]
  ];
  coinPos.forEach(([x,y])=> addCoin(x,y));

  // 敌人
  addPatroller(560, 430, 1);
  addPatroller(1000, 430, -1);
  addPatroller(1650, 430, 1);
  addPatroller(2100, 430, -1);
  addPatroller(720, 340, 1, 100);
  addPatroller(1440, 320, -1, 90);

  addFlyer(900, 240, 1);
  addFlyer(1350, 200, -1);
  addFlyer(1850, 230, 1);

  // BOSS 区域
  const bossX = 2400;
  addPlatform(bossX-120, 470, 900, 70, 'solid');
  addPlatform(bossX+200, 350, 160, 18, 'solid');
  addPlatform(bossX+480, 300, 160, 18, 'solid');
  portal = { x: bossX + 700, y: 380, w: 60, h: 90, active: false };
  boss = {
    x: bossX + 450, y: 300, w: 96, h: 110,
    hp: 40, maxHp: 40, active: false, vx: 0, vy: 0,
    phase: 0, timer: 0, attackTimer: 90, hitFlash: 0,
    dead: false, dir: -1, baseY: 300, bob: 0, action: 'idle'
  };
}

function addSpikes(x, y, w){
  spikes.push({x, y: y-16, w, h: 16});
}
function addCoin(x,y){ coins.push({x,y,w:16,h:16,got:false,phase:Math.random()*6.28, pop:0}); }
function addPatroller(x,y,dir,range){
  enemies.push({
    type:'patroller', x, y: y-28, w:28, h:28, vx: dir*1.1, vy:0,
    dir, hp:2, hitFlash:0, dead:false, onGround:false, baseX:x, range: range||120,
    anim:0, alive:true
  });
}
function addFlyer(x,y,dir){
  enemies.push({
    type:'flyer', x, y, w:30, h:24, vx: dir*1.4, vy:0, dir,
    hp:2, hitFlash:0, dead:false, baseY:y, anim:Math.random()*6.28, alive:true
  });
}

/* ==================== 物理辅助 ==================== */
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function scoreAdd(n, x, y, color){
  game.score += n;
  scorePop = 1;
  if(x!==undefined) floatText(x, y, '+'+n, color||'#f8f8f8', 16);
}

function comboAdd(){
  game.combo++;
  game.comboTimer = 120;
  if(game.combo >= 2){
    floatText(player.x+13, player.y-14, 'COMBO x'+game.combo+'!', '#eab308', 16+Math.min(8,game.combo));
  }
}

/* ==================== 更新 ==================== */
function update(){
  if(game.state !== 'play') return;
  game.time++;

  if(hitStopFrames > 0){ hitStopFrames--; updateParticles(); return; }

  // 连击计时
  if(game.comboTimer > 0){ game.comboTimer--; if(game.comboTimer===0) game.combo = 0; }

  // 分数缓动
  game.displayScore += (game.score - game.displayScore) * 0.18;
  if(Math.abs(game.score - game.displayScore) < 0.5) game.displayScore = game.score;
  if(scorePop>0) scorePop -= 0.06;

  updatePlayer();
  updateEnemies();
  updateBoss();
  updateCoins();
  updatePlatforms();
  updateParticles();
  updateCamera();

  // 掉落死亡
  if(player.y > H + 120) killPlayer();

  // 胜利判定
  if(boss && boss.dead && portal){
    portal.active = true;
    if(rectsOverlap(player, portal) && game.state==='play'){
      game.state = 'win';
      SFX.win();
      game.score += 500;
      saveBest();
    }
  }
}

function updatePlayer(){
  const p = player;
  p.animTimer++;
  if(p.animTimer >= 6){ p.animTimer = 0; p.animFrame = (p.animFrame+1)%4; }

  // 挤压回弹
  p.squashX += (1-p.squashX)*0.18;
  p.squashY += (1-p.squashY)*0.18;

  // 水平移动
  const accel = p.onGround ? 0.9 : 0.55;
  const maxSpd = 4.4;
  if(input.left){ p.vx -= accel; p.facing = -1; }
  if(input.right){ p.vx += accel; p.facing = 1; }
  if(!input.left && !input.right) p.vx *= p.onGround ? 0.72 : 0.88;
  p.vx = clamp(p.vx, -maxSpd, maxSpd);

  // 跳跃
  if(input.jumpPressed && (p.onGround || p.jumpCount < 1)){
    if(!p.onGround) p.jumpCount = 1;
    p.vy = -12.2;
    p.onGround = false;
    p.squashX = 0.7; p.squashY = 1.3;
    SFX.jump();
    for(let i=0;i<6;i++){
      particles.push(new Particle(p.x+p.w/2, p.y+p.h, (Math.random()-0.5)*2.4, Math.random()*1.2,
        ['#f8f8f8','#cbd5e1','#94a3b8'][i%3], 3, 16, 0.06));
    }
  }
  input.jumpPressed = false;

  // 攻击
  if(p.attackCD > 0) p.attackCD--;
  if(input.attackPressed && p.attackCD === 0){
    p.attackTimer = 14;
    p.attackCD = 24;
    SFX.attack();
    doAttack();
  }
  input.attackPressed = false;
  if(p.attackTimer > 0) p.attackTimer--;

  // 重力
  p.vy += GRAVITY;
  p.vy = Math.min(p.vy, MAXFALL);

  // 移动
  p.x += p.vx;
  p.onGround = false;
  resolvePlatformCollisionX(p);
  p.y += p.vy;
  resolvePlatformCollisionY(p);

  // 边界
  if(p.x < 0){ p.x = 0; p.vx = 0; }
  if(p.x > game.levelLen - p.w) p.x = game.levelLen - p.w;

  // 无敌时间
  if(p.invuln > 0) p.invuln--;
  if(p.shield > 0) p.shield--;

  // 拖尾粒子
  if(Math.abs(p.vx) > 1.5 && game.time % 3 === 0){
    particles.push(new Particle(p.x+p.w/2, p.y+p.h-4, -p.vx*0.15, -Math.random()*0.6,
      '#3b82f6', 2.5, 12, 0.02));
  }
}

function doAttack(){
  const p = player;
  const range = 46;
  const ax = p.facing === 1 ? p.x + p.w : p.x - range;
  const hitbox = {x: ax, y: p.y - 6, w: range, h: p.h + 12};
  let hitAny = false;

  // 攻击特效粒子
  for(let i=0;i<8;i++){
    const t = i/8;
    particles.push(new Particle(
      p.x + p.w/2 + p.facing*(14+t*36), p.y + 8 + t*18,
      p.facing*(1.5+Math.random()*2), (Math.random()-0.5)*2,
      i%2 ? '#f8f8f8' : '#eab308', 3.5, 14, 0.05));
  }

  // 敌人
  enemies.forEach(e=>{
    if(e.dead || !e.alive) return;
    if(rectsOverlap(hitbox, e)){
      damageEnemy(e, 1);
      hitAny = true;
    }
  });

  // BOSS
  if(boss && boss.active && !boss.dead && rectsOverlap(hitbox, boss)){
    damageBoss(1);
    hitAny = true;
  }

  if(hitAny){
    hitStop(5);
    screenShake(5, 10);
    SFX.hit();
  }
}

function damageEnemy(e, dmg){
  e.hp -= dmg;
  e.hitFlash = 10;
  comboAdd();
  const pts = 30 * Math.max(1, game.combo);
  scoreAdd(pts, e.x+e.w/2, e.y-6, '#eab308');
  burst(e.x+e.w/2, e.y+e.h/2, 10, ['#ef4444','#f8f8f8','#fdba74'], 3.2, 3, 18, 0.12);

  if(e.hp <= 0){
    e.dead = true;
    e.alive = false;
    SFX.explode();
    screenShake(9, 18);
    hitStop(8);
    burst(e.x+e.w/2, e.y+e.h/2, 20, ['#ff6b6b','#ffd93d','#ff8c42','#f8f8f8'], 5, 4, 30, 0.14);
    scoreAdd(80, e.x+e.w/2, e.y, '#22c55e');
  }
}

function damageBoss(dmg){
  boss.hp -= dmg;
  boss.hitFlash = 10;
  comboAdd();
  SFX.hit();
  hitStop(6);
  screenShake(7, 12);
  scoreAdd(50, boss.x+boss.w/2, boss.y-10, '#ef4444');
  burst(boss.x+boss.w/2, boss.y+boss.h/2, 12, ['#ef4444','#f8f8f8','#eab308'], 4, 4, 20, 0.1);
  // 阶段变化
  const ratio = boss.hp / boss.maxHp;
  if(ratio < 0.66 && boss.phase < 1){ boss.phase = 1; SFX.boss(); screenShake(14, 30); floatText(boss.x+boss.w/2, boss.y-40, 'BOSS 狂暴!', '#ef4444', 22); }
  if(ratio < 0.33 && boss.phase < 2){ boss.phase = 2; SFX.boss(); screenShake(16, 34); floatText(boss.x+boss.w/2, boss.y-40, '最终阶段!', '#ffd93d', 22); }

  if(boss.hp <= 0 && !boss.dead){
    boss.dead = true;
    SFX.explode();
    screenShake(18, 40);
    hitStop(20);
    for(let i=0;i<40;i++){
      setTimeout(()=>{
        if(!boss) return;
        burst(boss.x+Math.random()*boss.w, boss.y+Math.random()*boss.h, 8,
          ['#ff6b6b','#ffd93d','#ff8c42','#f8f8f8'], 5, 4, 30, 0.12);
      }, i*30);
    }
    scoreAdd(1000, boss.x+boss.w/2, boss.y, '#eab308');
    floatText(boss.x+boss.w/2, boss.y-30, 'BOSS 击败!', '#22c55e', 26);
  }
}

function updateEnemies(){
  enemies.forEach(e=>{
    if(e.dead) return;
    if(e.hitFlash > 0) e.hitFlash--;
    if(Math.abs(e.x - player.x) > 900) return; // 屏幕外休眠

    if(e.type === 'patroller'){
      e.x += e.vx;
      if(e.x < e.baseX - e.range){ e.x = e.baseX - e.range; e.vx *= -1; }
      if(e.x > e.baseX + e.range){ e.x = e.baseX + e.range; e.vx *= -1; }
      e.dir = e.vx > 0 ? 1 : -1;
      // 重力 + 平台
      e.vy += GRAVITY;
      e.vy = Math.min(e.vy, MAXFALL);
      e.y += e.vy;
      e.onGround = false;
      for(const pf of platforms){
        const px = pf.x + (pf.ox!==undefined ? pf.dx||0 : 0);
        if(e.x < px+pf.w && e.x+e.w > px && e.y+e.h > pf.y && e.y+e.h < pf.y+pf.h+18 && e.vy >= 0){
          e.y = pf.y - e.h; e.vy = 0; e.onGround = true;
        }
      }
      if(!e.onGround) e.anim = 0;
    } else if(e.type === 'flyer'){
      e.anim += 0.05;
      e.x += e.vx;
      e.y = e.baseY + Math.sin(e.anim)*40;
      if(e.x < e.baseX - 160) e.vx = Math.abs(e.vx);
      if(e.x > e.baseX + 160) e.vx = -Math.abs(e.vx);
      e.dir = e.vx > 0 ? 1 : -1;
    }

    // 碰撞玩家
    if(!player.dead && player.invuln === 0 && rectsOverlap(player, e)){
      hurtPlayer(e.x);
    }
  });
  // 清理远处死亡敌人
  enemies = enemies.filter(e => !e.dead || (e.dead && Math.random() > 0.01));
}

function updateBoss(){
  if(!boss || boss.dead) return;
  const b = boss;
  const dist = Math.abs(player.x - b.x);
  if(!b.active && dist < 700){
    b.active = true;
    SFX.boss();
    screenShake(10, 20);
    floatText(b.x+b.w/2, b.y-50, 'BOSS 出现!', '#ef4444', 26);
  }
  if(!b.active) return;

  if(b.hitFlash > 0) b.hitFlash--;
  b.timer++;
  b.bob += 0.06;
  b.y = b.baseY + Math.sin(b.bob)*10;

  // 面向玩家
  b.dir = player.x < b.x ? -1 : 1;

  // 攻击计时
  b.attackTimer--;
  if(b.attackTimer <= 0){
    const spd = b.phase===0 ? 130 : b.phase===1 ? 95 : 70;
    b.attackTimer = spd + Math.random()*40;

    // 选择攻击
    if(b.phase === 0){
      // 冲撞
      if(Math.random() < 0.5){
        b.vx = b.dir * 4.5;
        b.action = 'charge';
        b.timer = 0;
        SFX.attack();
      } else {
        // 发射弹幕
        fireBossBullet(b.x+b.w/2, b.y+b.h/2, player.x, player.y, 3.4);
        fireBossBullet(b.x+b.w/2, b.y+b.h/2, player.x, player.y, 3.4, 0.3);
        fireBossBullet(b.x+b.w/2, b.y+b.h/2, player.x, player.y, 3.4, -0.3);
        SFX.attack();
      }
    } else if(b.phase === 1){
      // 三连冲撞 + 弹幕
      const r = Math.random();
      if(r < 0.5){
        b.vx = b.dir * 5.2;
        b.action = 'charge';
        b.timer = 0;
      } else {
        for(let i=-1;i<=1;i++){
          fireBossBullet(b.x+b.w/2, b.y+b.h/2, player.x, player.y, 3.8, i*0.25);
        }
        SFX.attack();
      }
    } else {
      // 弹幕雨
      const r = Math.random();
      if(r < 0.35){
        b.vx = b.dir * 6;
        b.action = 'charge';
        b.timer = 0;
      } else {
        for(let i=0;i<5;i++){
          fireBossBullet(b.x+b.w/2, b.y+b.h/2, player.x + (Math.random()-0.5)*300, player.y + (Math.random()-0.5)*200, 3.6 + Math.random()*1.5);
        }
        SFX.attack();
        screenShake(6, 10);
      }
    }
  }

  // 冲撞位移
  if(b.action === 'charge'){
    b.x += b.vx;
    b.vx *= 0.97;
    if(Math.abs(b.vx) < 0.4){ b.action = 'idle'; b.vx = 0; }
    // 限制范围
    if(b.x < 2280){ b.x = 2280; b.vx = 0; b.action='idle'; }
    if(b.x > 3150){ b.x = 3150; b.vx = 0; b.action='idle'; }
  }

  // 碰撞玩家
  if(!player.dead && player.invuln === 0 && rectsOverlap(player, b)){
    hurtPlayer(b.x + b.w/2);
  }
}

function fireBossBullet(x, y, tx, ty, spd, angleOff){
  const ang = Math.atan2(ty-y, tx-x) + (angleOff||0);
  hazards.push({
    x, y, w: 14, h: 14,
    vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
    life: 220, type: 'bullet', anim: 0
  });
}

function updateCoins(){
  coins.forEach(c=>{
    if(c.got) return;
    c.phase += 0.08;
    if(c.pop > 0) c.pop--;

    const dx = player.x + player.w/2 - (c.x + c.w/2);
    const dy = player.y + player.h/2 - (c.y + c.h/2);
    const dist = Math.hypot(dx,dy);

    // 磁吸
    if(dist < 110 && dist > 1){
      const pull = (1 - dist/110) * 6;
      c.x += dx/dist * pull;
      c.y += dy/dist * pull;
    }

    if(dist < 26){
      c.got = true;
      game.coins++;
      comboAdd();
      const pts = 10 * Math.max(1, game.combo);
      scoreAdd(pts, c.x, c.y-8, '#eab308');
      SFX.coin();
      // 金色粒子向上飘
      for(let i=0;i<8;i++){
        particles.push(new Particle(c.x+8, c.y+8, (Math.random()-0.5)*2.4, -1-Math.random()*2,
          ['#eab308','#ffd93d','#f8f8f8'][i%3], 3, 28, -0.04));
      }
      screenShake(2, 5);
      c.pop = 10;
    }
  });
}

function updatePlatforms(){
  platforms.forEach(p=>{
    if(p.type === 'moving'){
      p.phase += p.speed;
      if(p.vertical){
        const ny = p.oy + Math.sin(p.phase) * p.range;
        // 携带玩家
        if(player.onGround && Math.abs(player.y + player.h - p.y) < 8 && player.x + player.w > p.x && player.x < p.x + p.w){
          player.y += ny - p.y;
        }
        p.y = ny;
      } else {
        const nx = p.ox + Math.sin(p.phase) * p.range;
        if(player.onGround && Math.abs(player.y + player.h - p.y) < 8 && player.x + player.w > p.x && player.x < p.x + p.w){
          player.x += nx - p.x;
        }
        p.x = nx;
      }
    }
  });

  // 尖刺与弹幕
  spikes.forEach(s=>{
    if(!player.dead && player.invuln === 0 && rectsOverlap(player, s)){
      hurtPlayer(s.x + s.w/2);
    }
  });

  hazards.forEach(h=>{
    h.anim += 0.15;
    h.x += h.vx; h.y += h.vy; h.life--;
    if(h.type === 'bullet' && Math.random() < 0.5){
      particles.push(new Particle(h.x+7, h.y+7, (Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, '#ef4444', 2.5, 10, 0));
    }
    if(!player.dead && player.invuln === 0 && rectsOverlap(player, h)){
      hurtPlayer(h.x);
      h.life = 0;
    }
  });
  hazards = hazards.filter(h => h.life > 0 && h.x > -100 && h.x < game.levelLen + 200);
}

function updateParticles(){
  particles.forEach(p=>p.update());
  particles = particles.filter(p=>p.life > 0);
  if(particles.length > 500) particles.splice(0, particles.length-500);
  floatTexts.forEach(f=>f.update());
  floatTexts = floatTexts.filter(f=>f.life > 0);
}

function updateCamera(){
  const targetX = player.x - W*0.38;
  game.camX += (targetX - game.camX) * 0.12;
  game.camX = clamp(game.camX, 0, game.levelLen - W);
}

function hurtPlayer(srcX){
  if(player.invuln > 0 || player.dead) return;
  if(player.shield > 0){
    player.shield = 0;
    player.invuln = 60;
    SFX.power();
    screenShake(6, 14);
    burst(player.x+player.w/2, player.y+player.h/2, 16, ['#3b82f6','#f8f8f8'], 4, 3, 20, 0.08);
    floatText(player.x+player.w/2, player.y-10, '护盾破碎', '#3b82f6', 16);
    return;
  }
  player.hp--;
  player.invuln = 75;
  player.squashX = 1.35; player.squashY = 0.7;
  SFX.hurt();
  screenShake(9, 18);
  hitStop(6);
  burst(player.x+player.w/2, player.y+player.h/2, 14, ['#ef4444','#f8f8f8'], 4, 3, 22, 0.1);
  floatText(player.x+player.w/2, player.y-10, '-1 HP', '#ef4444', 18);
  // 击退
  const dir = player.x < srcX ? -1 : 1;
  player.vx = dir * 6;
  player.vy = -6;
  game.combo = 0;
  if(player.hp <= 0) killPlayer();
}

function killPlayer(){
  if(player.dead) return;
  player.dead = true;
  game.state = 'over';
  SFX.lose();
  screenShake(14, 30);
  burst(player.x+player.w/2, player.y+player.h/2, 30, ['#ef4444','#f8f8f8','#fdba74'], 5, 4, 40, 0.14);
  saveBest();
}

function saveBest(){
  if(game.score > game.best){
    game.best = Math.floor(game.score);
    localStorage.setItem('pxHeroBest', String(game.best));
  }
}

function togglePause(){
  if(game.state === 'play'){ game.state = 'pause'; }
  else if(game.state === 'pause'){ game.state = 'play'; }
}

function startGame(){
  ensureAudio();
  resetGame();
  game.state = 'play';
}

/* ==================== 碰撞解析 ==================== */
function resolvePlatformCollisionX(p){
  for(const pf of platforms){
    if(pf.type === 'moving' || pf.type === 'solid'){
      if(rectsOverlap(p, pf) && p.y + p.h > pf.y + 4 && p.y < pf.y + pf.h - 4){
        if(p.vx > 0){ p.x = pf.x - p.w; }
        else if(p.vx < 0){ p.x = pf.x + pf.w; }
        p.vx = 0;
      }
    }
  }
}
function resolvePlatformCollisionY(p){
  p.onGround = false;
  for(const pf of platforms){
    if(pf.type === 'moving' || pf.type === 'solid'){
      if(rectsOverlap(p, pf)){
        if(p.vy >= 0 && p.y + p.h - p.vy <= pf.y + 8){
          p.y = pf.y - p.h;
          if(p.vy > 5){
            p.squashX = 1.3; p.squashY = 0.72;
            for(let i=0;i<4;i++){
              particles.push(new Particle(p.x+p.w/2, p.y+p.h, (Math.random()-0.5)*3, -Math.random()*1.5,
                '#94a3b8', 2.5, 12, 0.08));
            }
          }
          p.vy = 0;
          p.onGround = true;
          p.jumpCount = 0;
        } else if(p.vy < 0){
          p.y = pf.y + pf.h;
          p.vy = 0;
        }
      }
    }
  }
}

/* ==================== 渲染 ==================== */
let bgStars = [];
for(let i=0;i<90;i++){
  bgStars.push({x: Math.random()*W*2, y: Math.random()*H*0.85, s: Math.random()<0.3?3:2, layer: Math.random()<0.5?0.25:0.5, tw: Math.random()*6.28});
}

function draw(){
  ctx.setTransform(scale,0,0,scale,0,0);
  ctx.clearRect(0,0,W,H);

  // 屏幕震动
  ctx.save();
  if(shakeTime > 0){
    ctx.translate((Math.random()-0.5)*shakeIntensity, (Math.random()-0.5)*shakeIntensity);
    shakeTime--; shakeIntensity *= 0.9;
    if(shakeTime <= 0) shakeIntensity = 0;
  }

  drawBackground();

  if(game.state === 'title'){
    drawTitle();
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.translate(-Math.round(game.camX), 0);
  drawWorld();
  ctx.restore();

  drawHUD();

  if(game.state === 'pause') drawPause();
  if(game.state === 'over') drawOver();
  if(game.state === 'win') drawWin();

  ctx.restore();
}

function drawBackground(){
  // 天空渐变
  const g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0, '#1a1c2c');
  g.addColorStop(0.55, '#29366f');
  g.addColorStop(1, '#3b4d8f');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);

  // 视差星星
  for(const s of bgStars){
    const px = ((s.x - game.camX * s.layer) % (W*2) + W*2) % (W*2) - W*0.5;
    const tw = 0.5 + 0.5*Math.sin(game.time*0.03 + s.tw);
    ctx.globalAlpha = 0.35 + tw*0.5;
    ctx.fillStyle = s.layer < 0.4 ? '#f8f8f8' : '#cbd5e1';
    ctx.fillRect(Math.round(px), Math.round(s.y), s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // 远景山脉（视差）
  const par = game.camX * 0.18;
  ctx.fillStyle = '#20264a';
  for(let i=0;i<14;i++){
    const bx = i*180 - (par % 180) - 100;
    const bh = 120 + (i%3)*50;
    ctx.beginPath();
    ctx.moveTo(bx, H-40);
    ctx.lineTo(bx+90, H-40-bh);
    ctx.lineTo(bx+180, H-40);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = '#2a3160';
  for(let i=0;i<18;i++){
    const bx = i*140 - ((game.camX*0.32) % 140) - 80;
    const bh = 80 + (i%4)*30;
    ctx.beginPath();
    ctx.moveTo(bx, H-30);
    ctx.lineTo(bx+70, H-30-bh);
    ctx.lineTo(bx+140, H-30);
    ctx.closePath();
    ctx.fill();
  }
}

function drawWorld(){
  // 平台
  platforms.forEach(p=>{
    const x = Math.round(p.x), y = Math.round(p.y);
    if(x + p.w < game.camX - 60 || x > game.camX + W + 60) return;
    if(p.type === 'moving'){
      ctx.fillStyle = '#3b82f6';
      ctx.fillRect(x, y, p.w, p.h);
      ctx.fillStyle = '#60a5fa';
      ctx.fillRect(x, y, p.w, 3);
      ctx.fillStyle = '#1e3a8a';
      ctx.fillRect(x, y+p.h-3, p.w, 3);
      // 像素纹理
      ctx.fillStyle = '#2563eb';
      for(let i=4;i<p.w-4;i+=12) ctx.fillRect(x+i, y+6, 4, 2);
    } else {
      ctx.fillStyle = '#4b5563';
      ctx.fillRect(x, y, p.w, p.h);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(x, y, p.w, 6);
      ctx.fillStyle = '#16a34a';
      for(let i=0;i<p.w;i+=8) ctx.fillRect(x+i, y+6, 4, 3);
      ctx.fillStyle = '#374151';
      for(let i=0;i<p.w;i+=16) ctx.fillRect(x+i+4, y+14, 8, 4);
      // 边框
      ctx.strokeStyle = '#1f2937';
      ctx.lineWidth = 2;
      ctx.strokeRect(x+1, y+1, p.w-2, p.h-2);
    }
  });

  // 尖刺
  spikes.forEach(s=>{
    const x = Math.round(s.x);
    if(x + s.w < game.camX - 40 || x > game.camX + W + 40) return;
    for(let i=0;i<s.w;i+=12){
      ctx.fillStyle = '#94a3b8';
      ctx.beginPath();
      ctx.moveTo(x+i, s.y+s.h);
      ctx.lineTo(x+i+6, s.y);
      ctx.lineTo(x+i+12, s.y+s.h);
      ctx.closePath();
      ctx.fill();
      ctx.fillStyle = '#e2e8f0';
      ctx.fillRect(x+i+5, s.y+4, 2, s.h-6);
    }
    ctx.fillStyle = '#475569';
    ctx.fillRect(x, s.y+s.h-3, s.w, 3);
  });

  // 金币
  coins.forEach(c=>{
    if(c.got) return;
    if(c.x < game.camX - 30 || c.x > game.camX + W + 30) return;
    const bob = Math.sin(c.phase)*2.5;
    const cx = Math.round(c.x+8), cy = Math.round(c.y+8+bob);
    const size = 8 + Math.sin(c.phase*2)*1.2;
    ctx.fillStyle = '#eab308';
    ctx.fillRect(cx-size, cy-size, size*2, size*2);
    ctx.fillStyle = '#fde047';
    ctx.fillRect(cx-size+2, cy-size+2, size*2-4, size*2-4);
    ctx.fillStyle = '#a16207';
    ctx.fillRect(cx-2, cy-4, 4, 8);
    ctx.fillStyle = '#fff7cc';
    ctx.fillRect(cx-size+3, cy-size+3, 3, 3);
  });

  // 传送门
  if(portal && portal.active){
    const px = portal.x, py = portal.y;
    const t = game.time*0.05;
    ctx.globalAlpha = 0.5 + Math.sin(t)*0.3;
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(px-6, py-6, portal.w+12, portal.h+12);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(px, py, portal.w, portal.h);
    for(let i=0;i<6;i++){
      const yy = py + ((game.time*2 + i*20) % portal.h);
      ctx.fillStyle = i%2 ? '#22c55e' : '#a7f3d0';
      ctx.fillRect(px+8, yy, portal.w-16, 4);
    }
    ctx.strokeStyle = '#f8f8f8';
    ctx.lineWidth = 2;
    ctx.strokeRect(px, py, portal.w, portal.h);
  }

  // 敌人
  enemies.forEach(e=>{
    if(e.dead) return;
    if(e.x < game.camX - 80 || e.x > game.camX + W + 80) return;
    drawEnemy(e);
  });

  // BOSS
  if(boss && boss.active && !boss.dead) drawBoss(boss);

  // 玩家
  if(!player.dead) drawPlayer();

  // 粒子
  particles.forEach(p=>p.draw(ctx));

  // 浮动文字
  floatTexts.forEach(f=>f.draw(ctx));

  // 弹幕
  hazards.forEach(h=>{
    if(h.x < game.camX - 40 || h.x > game.camX + W + 40) return;
    const pulse = 0.6 + Math.sin(h.anim)*0.4;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#ef4444';
    ctx.fillRect(Math.round(h.x)-2, Math.round(h.y)-2, 18, 18);
    ctx.globalAlpha = 1;
    ctx.fillStyle = '#fca5a5';
    ctx.fillRect(Math.round(h.x)+2, Math.round(h.y)+2, 10, 10);
    ctx.fillStyle = '#f8f8f8';
    ctx.fillRect(Math.round(h.x)+5, Math.round(h.y)+5, 4, 4);
  });
}

function drawPlayer(){
  const p = player;
  if(p.invuln > 0 && Math.floor(game.time/4) % 2 === 0) return;

  const sx = p.squashX, sy = p.squashY;
  const cx = p.x + p.w/2, by = p.y + p.h;
  ctx.save();
  ctx.translate(cx, by);
  ctx.scale(sx * p.facing, sy);
  ctx.translate(-p.w/2, -p.h);

  const walk = p.onGround && Math.abs(p.vx) > 0.6 ? p.animFrame : 0;

  // 身体
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(2, 12, 22, 22);       // 轮廓

  ctx.fillStyle = '#3b82f6';
  ctx.fillRect(4, 14, 18, 16);       // 衣服

  // 头部
  ctx.fillStyle = '#fdba74';
  ctx.fillRect(5, 2, 16, 13);
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(4, 0, 18, 4);         // 帽子/头发

  // 眼睛（像素2x2）
  ctx.fillStyle = '#1a1c2c';
  ctx.fillRect(9, 7, 3, 3);
  ctx.fillRect(16, 7, 3, 3);
  ctx.fillStyle = '#f8f8f8';
  ctx.fillRect(10, 7, 1, 1);
  ctx.fillRect(17, 7, 1, 1);

  // 腿
  ctx.fillStyle = '#1e3a8a';
  if(!p.onGround){
    ctx.fillRect(6, 30, 6, 6);
    ctx.fillRect(15, 30, 6, 6);
  } else if(walk === 1 || walk === 3){
    ctx.fillRect(4, 30, 7, 6);
    ctx.fillRect(16, 30, 7, 6);
  } else {
    ctx.fillRect(6, 30, 6, 6);
    ctx.fillRect(15, 30, 6, 6);
  }

  // 攻击特效
  if(p.attackTimer > 0){
    const t = 1 - p.attackTimer/14;
    ctx.globalAlpha = 1 - t*0.6;
    ctx.fillStyle = '#f8f8f8';
    const ar = 20 + t*18;
    ctx.fillRect(24, 8, ar, 4);
    ctx.fillStyle = '#eab308';
    ctx.fillRect(24, 12, ar*0.7, 3);
    ctx.globalAlpha = 1;
  }

  ctx.restore();

  // 护盾
  if(p.shield > 0){
    ctx.strokeStyle = '#3b82f6';
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.6 + Math.sin(game.time*0.2)*0.3;
    ctx.strokeRect(p.x-5, p.y-5, p.w+10, p.h+10);
    ctx.globalAlpha = 1;
  }
}

function drawEnemy(e){
  const flash = e.hitFlash > 0 && Math.floor(e.hitFlash/2)%2 === 0;
  ctx.save();
  ctx.translate(Math.round(e.x), Math.round(e.y));

  if(e.type === 'patroller'){
    // 轮廓
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 2, e.w, e.h-2);
    // 身体
    ctx.fillStyle = flash ? '#f8f8f8' : '#ef4444';
    ctx.fillRect(2, 4, e.w-4, e.h-8);
    // 眼睛
    ctx.fillStyle = '#f8f8f8';
    ctx.fillRect(6, 9, 5, 5);
    ctx.fillRect(e.w-11, 9, 5, 5);
    ctx.fillStyle = '#1a1c2c';
    const eo = e.dir > 0 ? 2 : 0;
    ctx.fillRect(7+eo, 10, 3, 3);
    ctx.fillRect(e.w-10+eo, 10, 3, 3);
    // 腿
    ctx.fillStyle = '#991b1b';
    const legOff = Math.floor(game.time/8)%2;
    ctx.fillRect(4, e.h-6, 6, 6-legOff*2);
    ctx.fillRect(e.w-10, e.h-6, 6, 4+legOff*2);
    // 尖刺
    ctx.fillStyle = '#7f1d1d';
    ctx.fillRect(4, 0, 4, 4);
    ctx.fillRect(e.w-8, 0, 4, 4);
  } else {
    // 飞行怪
    const flap = Math.floor(game.time/6)%2;
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(2, 4, e.w-4, e.h-8);
    ctx.fillStyle = flash ? '#f8f8f8' : '#a855f7';
    ctx.fillRect(4, 6, e.w-8, e.h-12);
    // 翅膀
    ctx.fillStyle = '#7e22ce';
    if(flap){ ctx.fillRect(-6, 2, 10, 6); ctx.fillRect(e.w-4, 2, 10, 6); }
    else { ctx.fillRect(-4, 8, 8, 6); ctx.fillRect(e.w-4, 8, 8, 6); }
    // 眼睛
    ctx.fillStyle = '#f8f8f8';
    ctx.fillRect(8, 10, 4, 4);
    ctx.fillRect(e.w-12, 10, 4, 4);
    ctx.fillStyle = '#1a1c2c';
    ctx.fillRect(9, 11, 2, 2);
    ctx.fillRect(e.w-11, 11, 2, 2);
  }
  ctx.restore();
}

function drawBoss(b){
  const flash = b.hitFlash > 0 && Math.floor(b.hitFlash/2)%2 === 0;
  ctx.save();
  ctx.translate(Math.round(b.x), Math.round(b.y));

  // 光环
  ctx.globalAlpha = 0.25 + Math.sin(game.time*0.1)*0.15;
  ctx.fillStyle = b.phase===2 ? '#ef4444' : '#a855f7';
  ctx.fillRect(-14, -14, b.w+28, b.h+28);
  ctx.globalAlpha = 1;

  // 身体轮廓
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, b.w, b.h);

  // 主体
  const bodyColor = flash ? '#f8f8f8' : (b.phase===2 ? '#dc2626' : b.phase===1 ? '#b91c1c' : '#7f1d1d');
  ctx.fillStyle = bodyColor;
  ctx.fillRect(4, 4, b.w-8, b.h-8);

  // 盔甲纹理
  ctx.fillStyle = b.phase===2 ? '#fbbf24' : '#991b1b';
  ctx.fillRect(10, 16, b.w-20, 8);
  ctx.fillRect(10, 40, b.w-20, 6);
  ctx.fillRect(10, 70, b.w-20, 6);

  // 头部
  ctx.fillStyle = flash ? '#f8f8f8' : '#4c1d95';
  ctx.fillRect(20, -2, b.w-40, 22);

  // 眼睛（发光）
  const eyeColor = b.phase===2 ? '#fbbf24' : '#f8f8f8';
  ctx.fillStyle = eyeColor;
  ctx.fillRect(28, 6, 12, 8);
  ctx.fillRect(b.w-40, 6, 12, 8);
  ctx.fillStyle = '#ef4444';
  ctx.fillRect(32, 9, 5, 4);
  ctx.fillRect(b.w-36, 9, 5, 4);

  // 角
  ctx.fillStyle = '#1e293b';
  ctx.fillRect(14, -14, 8, 14);
  ctx.fillRect(b.w-22, -14, 8, 14);

  // 手臂
  ctx.fillStyle = bodyColor;
  ctx.fillRect(-12, 26, 14, 30);
  ctx.fillRect(b.w-2, 26, 14, 30);

  ctx.restore();

  // 血条
  const bw = 140, bh = 12;
  const bx = b.x + b.w/2 - bw/2, by = b.y - 34;
  ctx.fillStyle = '#1a1c2c';
  ctx.fillRect(bx-2, by-2, bw+4, bh+4);
  ctx.fillStyle = '#4b5563';
  ctx.fillRect(bx, by, bw, bh);
  const ratio = Math.max(0, b.hp / b.maxHp);
  const hpColor = ratio > 0.66 ? '#22c55e' : ratio > 0.33 ? '#eab308' : '#ef4444';
  ctx.fillStyle = hpColor;
  ctx.fillRect(bx, by, bw*ratio, bh);
  ctx.strokeStyle = '#f8f8f8';
  ctx.lineWidth = 1;
  ctx.strokeRect(bx+0.5, by+0.5, bw-1, bh-1);
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.fillStyle = '#f8f8f8';
  ctx.textAlign = 'center';
  ctx.fillText('BOSS', bx + bw/2, by - 6);
  ctx.textAlign = 'left';
}

function drawHUD(){

  ctx.fillStyle = '#f8f8f8';
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillText('体力', 24, 34);
  for(let i=0;i<player.maxHp;i++){
    const hx = 24 + i*30, hy = 42;
    ctx.fillStyle = '#1a1c2c';
    ctx.fillRect(hx-2, hy-2, 24, 16);

      ctx.fillStyle = '#ef4444';

      ctx.fillRect(hx, hy, 20, 4);

  ctx.fillStyle = '#eab308';

  ctx.fillText('分数 ' + sc, W-24, 40);

  // 金币数

  ctx.fillRect(12, 76, 130, 32);
  ctx.strokeStyle = '#f8f8f8';
  ctx.strokeRect(12, 76, 130, 32);
  ctx.fillStyle = '#eab308';
  ctx.fillRect(22, 84, 14, 14);
  ctx.fillStyle = '#fde047';
  ctx.fillRect(24, 86, 10, 10);

  ctx.fillStyle = '#f8f8f8';
  ctx.fillText('× ' + game.coins, 44, 99);

  // 连击
  if(game.combo >= 2){
    ctx.globalAlpha = Math.min(1, game.comboTimer/40);
    ctx.font = 'bold 26px "Courier New", monospace';
    ctx.fillStyle = '#eab308';
    ctx.textAlign = 'center';
    ctx.fillText('COMBO ×' + game.combo, W/2, 46);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // 进度条
  const prog = clamp(player.x / (game.levelLen - 100), 0, 1);
  const pw = 320, px = W/2 - pw/2, py = H - 30;
  ctx.fillStyle = 'rgba(26,28,44,0.72)';
  ctx.fillRect(px-4, py-4, pw+8, 18);
  ctx.strokeStyle = '#f8f8f8';
  ctx.lineWidth = 1;
  ctx.strokeRect(px-4, py-4, pw+8, 18);
  ctx.fillStyle = '#374151';
  ctx.fillRect(px, py, pw, 10);
  ctx.fillStyle = '#3b82f6';
  ctx.fillRect(px, py, pw*prog, 10);
  // 旗子
  ctx.fillStyle = '#22c55e';
  ctx.fillRect(px + pw*prog - 2, py-6, 4, 22);
  // 提示
  ctx.font = 'bold 14px "Courier New", monospace';
  ctx.fillStyle = '#cbd5e1';
  ctx.textAlign = 'center';
  ctx.fillText('▶ 向右前进', W/2, py - 12);
  ctx.textAlign = 'left';

  // 操作提示（大字号半透明框）
  ctx.font = 'bold 20px "Courier New", monospace';
  const hintW = 400, hintX = W/2 - hintW/2, hintY = H - 78;
  ctx.fillStyle = 'rgba(26,28,44,0.82)';
  ctx.fillRect(hintX, hintY, hintW, 36);
  ctx.strokeStyle = '#f8f8f8';
  ctx.lineWidth = 2;
  ctx.strokeRect(hintX, hintY, hintW, 36);
  ctx.fillStyle = '#f8f8f8';
  ctx.textAlign = 'center';
  ctx.font = 'bold 20px "Courier New", monospace';
  ctx.fillText('← → 移动  空格/↑ 跳跃  J 攻击  P 暂停', W/2, hintY + 25);
  ctx.textAlign = 'left';
}

/* ==================== 主循环 ==================== */
let lastTime = 0, accumulator = 0;
const STEP = 1000/60;

function loop(ts){
  if(!lastTime) lastTime = ts;
  let dt = ts - lastTime;
  lastTime = ts;
  if(dt > 200) dt = 200;
  accumulator += dt;
  let steps = 0;
  while(accumulator >= STEP && steps < 5){
    update();
    accumulator -= STEP;
    steps++;
  }
  draw();
  requestAnimationFrame(loop);
}

/* 初始化 */
resetGame();
game.state = 'title';
requestAnimationFrame(loop);

/* 防止移动端滚动 */
document.addEventListener('touchmove', e=>{ if(e.target.closest('#touch') || e.target === cv) e.preventDefault(); }, {passive:false});
