<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PromptToPlay - AI 游戏生成器 | 一句话生成可玩的网页游戏</title>
  <meta name="description" content="PromptToPlay 是一个 AI 驱动的 HTML5 游戏生成平台，输入一句话描述，AI 立即为你生成完整可玩的网页游戏。支持积分变现、一键部署。">
  <meta name="keywords" content="AI游戏生成,HTML5游戏,游戏开发,DeepSeek,网页游戏,游戏制作工具,AI游戏">
  <meta name="author" content="PromptToPlay">
  <meta name="theme-color" content="#7c3aed">

  <!-- Favicon (SVG emoji) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="PromptToPlay - AI 游戏生成器">
  <meta property="og:description" content="输入一句话，AI 立即生成完整可玩的 HTML5 游戏。">
  <meta property="og:site_name" content="PromptToPlay">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="PromptToPlay - AI 游戏生成器">
  <meta name="twitter:description" content="输入一句话，AI 立即生成完整可玩的网页游戏。">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 浮动装饰 -->
  <div class="floating-dot" style="width:80px;height:80px;background:#ff6b6b;top:10%;left:5%;animation-delay:0s;"></div>
  <div class="floating-dot" style="width:60px;height:60px;background:#4ecdc4;top:20%;right:8%;animation-delay:2s;"></div>
  <div class="floating-dot" style="width:100px;height:100px;background:#ffe66d;bottom:15%;left:10%;animation-delay:4s;"></div>
  <div class="floating-dot" style="width:50px;height:50px;background:#a78bfa;bottom:25%;right:15%;animation-delay:1s;"></div>

  <nav class="navbar">
    <a href="/" class="logo">PromptToPlay</a>
    <div class="nav-links">
      <a href="hall.html">游戏大厅</a>
      <a href="profile.html" id="nav-profile">个人中心</a>
      <span id="credits-badge" class="credits-badge" style="display:none;" onclick="showCreditShop()">🪙 <span id="credits-count">0</span></span>
      <a href="javascript:void(0)" id="nav-recharge" class="nav-recharge" onclick="showCreditShop()" style="display:none;">💰 充值</a>
      <a href="auth.html" id="nav-login">登录</a>
      <button onclick="logout()" id="nav-logout" style="display:none;">退出</button>
    </div>
  </nav>

  <main class="container">
    <section class="hero">
      <h1>🎮 创建你的游戏</h1>
      <p>描述任何游戏创意，AI 将立即为你生成完整可玩的 HTML5 游戏。</p>
    </section>

    <section class="generator-form">
      <form id="generate-form">
        <div class="form-row">
          <textarea
            id="prompt-input"
            placeholder="描述你的游戏... 例如：一个躲避小行星并收集道具的太空射击游戏"
            rows="3"
            required
          ></textarea>
        </div>
        <div class="prompt-examples" style="margin-bottom:12px;">
          <span style="font-size:.8rem;color:#888;margin-right:8px;">试试：</span>
          <button type="button" class="example-chip" onclick="fillExample('一个经典的贪吃蛇游戏，有分数和速度递增')">贪吃蛇</button>
          <button type="button" class="example-chip" onclick="fillExample('2048数字合并游戏，支持键盘和触摸操作')">2048</button>
          <button type="button" class="example-chip" onclick="fillExample('打砖块游戏，有多种道具和关卡')">打砖块</button>
          <button type="button" class="example-chip" onclick="fillExample('飞机大战射击游戏，玩家控制飞船躲避敌机并射击')">飞机大战</button>
          <button type="button" class="example-chip" onclick="fillExample('一个迷宫解谜游戏，玩家需要找到出口并避开陷阱')">迷宫解谜</button>
        </div>
        <div class="form-row form-controls">
          <select id="category-select">
            <option value="action">动作</option>
            <option value="puzzle">益智</option>
            <option value="shooting">射击</option>
            <option value="sports">体育</option>
            <option value="simulation">模拟</option>
            <option value="other">其他</option>
          </select>
          <button type="submit" id="generate-btn" class="btn btn-primary">✨ 生成游戏</button>
        </div>
      </form>
    </section>

    <section class="game-output" id="game-output" style="display:none;">
      <div class="output-controls">
        <div class="iterate-control" id="iterate-control" style="display:none;">
          <input type="text" id="iterate-input" placeholder="描述你想要的修改...">
          <button id="iterate-btn" class="btn btn-secondary">迭代优化</button>
        </div>
        <div class="action-buttons">
          <button id="remove-watermark-btn" class="btn btn-outline" style="display:none;">去除水印 (1 积分)</button>
          <button id="share-btn" class="btn btn-outline">分享</button>
        </div>
      </div>
      <iframe id="game-iframe" sandbox="allow-scripts allow-same-origin" style="width:100%;height:500px;border:1px solid #ddd;border-radius:8px;"></iframe>
    </section>
  </main>

  <div id="modal-overlay" class="modal-overlay" style="display:none;">
    <div class="modal" id="modal-content"></div>
  </div>

  <script src="app.js"></script>
  <script>
    function fillExample(text) {
      document.getElementById('prompt-input').value = text;
      document.getElementById('prompt-input').focus();
    }

    let currentGameId = null;
    let currentGameWatermarkRemoved = false;
    window._currentGameId = null;

    document.getElementById('generate-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!checkAuth()) { window.location.href = 'auth.html'; return; }

      const prompt = document.getElementById('prompt-input').value;
      const category = document.getElementById('category-select').value;
      const btn = document.getElementById('generate-btn');
      btn.disabled = true;
        btn.textContent = '正在生成...';

      try {
        const data = await apiCall('/api/generate', 'POST', { prompt, category });
        currentGameId = data.game_id;
        window._currentGameId = data.game_id;
        currentGameWatermarkRemoved = false;
        showGame(data.html);
        await updateUIState();
      } catch (err) {
        if (err.status === 429) {
          showQuotaModal();
        } else if (err.status === 500 && err.data && err.data.retryable) {
          showModal('生成失败', '生成失败，未扣配额。请尝试其他描述。');
        } else {
          showModal('错误', err.message || '出错了');
        }
      }
      btn.disabled = false;
      btn.textContent = '生成游戏';
    });

    function showGame(html) {
      document.getElementById('game-output').style.display = 'block';
      const iframe = document.getElementById('game-iframe');
      iframe.srcdoc = html;
      window.scrollTo({ top: document.getElementById('game-output').offsetTop - 80, behavior: 'smooth' });
    }

    async function updateUIState() {
      try {
        const data = await apiCall('/api/user/me');
        const plan = data.user.plan;
        const isPro = plan === 'pro' || plan === 'enterprise';

        document.getElementById('iterate-control').style.display = isPro ? 'flex' : 'none';
        document.getElementById('remove-watermark-btn').style.display = (!isPro && !currentGameWatermarkRemoved) ? 'inline-block' : 'none';

        // Update credits badge and recharge
        const credits = data.user.credits || 0;
        const badge = document.getElementById('credits-badge');
        const count = document.getElementById('credits-count');
        const recharge = document.getElementById('nav-recharge');
        if (badge) badge.style.display = 'inline';
        if (count) count.textContent = credits;
        if (recharge) recharge.style.display = 'inline';
      } catch (err) {
        // ignore
      }
    }

    // Show credits on load
    (async () => {
      if (checkAuth()) {
        try {
          const data = await apiCall('/api/user/me');
          const badge = document.getElementById('credits-badge');
          const count = document.getElementById('credits-count');
          const recharge = document.getElementById('nav-recharge');
          if (badge) badge.style.display = 'inline';
          if (count) count.textContent = data.user.credits || 0;
          if (recharge) recharge.style.display = 'inline';
        } catch {}
      } else {
        const recharge = document.getElementById('nav-recharge');
        if (recharge) recharge.style.display = 'inline';
      }
    })();

    document.getElementById('iterate-btn').addEventListener('click', async () => {
      const prompt = document.getElementById('iterate-input').value;
      if (!prompt) return;
      const btn = document.getElementById('iterate-btn');
      btn.disabled = true; btn.textContent = '优化中...';
      try {
        const data = await apiCall('/api/generate/iterate', 'POST', { gameId: currentGameId, prompt });
        showGame(data.html);
      } catch (err) {
        if (err.status === 429) showQuotaModal();
        else if (err.status === 403) showModal('需要升级', '迭代功能仅对 Pro 和企业版用户开放。');
        else showModal('错误', err.message || '迭代失败');
      }
      btn.disabled = false; btn.textContent = '迭代优化';
    });

    document.getElementById('remove-watermark-btn').addEventListener('click', async () => {
      if (!currentGameId) return;
      window._currentGameId = currentGameId;
      buyRemoveWatermark();
    });

    document.getElementById('share-btn').addEventListener('click', () => {
      shareGame(currentGameId);
    });
  </script>
</body>
</html>
