# PromptToPlay Docker Compose
# 使用方法：
#   1. 复制 .env.example 为 .env，填入 DEEPSEEK_API_KEY 和 JWT_SECRET
#   2. 运行：docker-compose up -d
#   3. 访问：http://localhost:3000

version: '3.8'

services:
  prompttoplay:
    build: .
    container_name: prompttoplay
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - DEEPSEEK_API_BASE=${DEEPSEEK_API_BASE:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - DOMAIN=${DOMAIN:-http://localhost:3000}
      - DEV_MODE=${DEV_MODE:-false}
      - DB_PATH=/app/data/prompttoplay.db
    volumes:
      - ptp_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ptp_data:
    driver: local
